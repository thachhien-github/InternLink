services:
  # =========================================================================
  # 1. ASP.NET Core Backend API (.NET 10 - Host Port: 7109 -> Container: 8080)
  # =========================================================================
  backend:
    build:
      context: ./backend/InternLink
      dockerfile: Dockerfile
    container_name: internlink_api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal,1433;Database=InternLink;User Id=sa;Password=sa;TrustServerCertificate=True;MultipleActiveResultSets=true;IPAddressPreference=IPv4First
      - Jwt__Secret=InternLink_SecretKey_Production_SuperSecure_32BytesLength!
      - Jwt__Issuer=InternLink
      - Jwt__Audience=InternLinkClients
      - Email__Enabled=false
      - Email__SmtpHost=smtp.gmail.com
      - Email__SmtpPort=587
      - Email__Username=internlink.cntt@gmail.com
      - Email__Password=
      - Email__FromAddress=internlink.cntt@gmail.com
      - Email__PortalUrl=http://localhost:3000
      - Cors__AllowedOrigins__0=http://localhost:3000
      - Cors__AllowedOrigins__1=http://localhost:5173
    ports:
      - "7109:8080"
    volumes:
      - internlink_uploads_data:/app/uploads
    networks:
      - internlink_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # =========================================================================
  # 2. Frontend React SPA & Nginx Reverse Proxy (Host Port: 3000 -> Container: 80)
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: internlink_frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - internlink_network
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'echo -e \"GET / HTTP/1.0\\r\\n\\r\\n\" | nc localhost 80 | head -1 | grep -qE \"200|301\"'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

# ===========================================================================
# Volumes & Networks Definition
# ===========================================================================
volumes:
  internlink_uploads_data:
    driver: local
    name: internlink_uploads_data

networks:
  internlink_network:
    driver: bridge
    name: internlink_network
